name: fleet-build container

# Builds and publishes ghcr.io/dezren39/fleet-build — the fleet's shared
# build/test image. Used as:
#   * a GitHub Actions job container (jobs.<job>.container) by repos in
#     BOTH dezren39 and developing-today — the package is public, the
#     namespace of the consuming repo does not matter;
#   * the Codespaces image for this repo (.devcontainer points at it).
#
# Pipeline (v3, 2026-11-02): base image -> per-repo warm-export jobs
# -> :full. The warmed Nix store is realised in NORMAL job containers,
# never inside `docker build`: Nix realisation under BuildKit died
# deterministically with a libstore SQLite assertion (runs
# 41516480304 / 41517835968). export.sh realises a repo's default dev
# shell from its flake.lock EXACTLY as committed (no
# `nix flake update` anywhere) and exports the closure as a file://
# binary cache; the :full image merely imports the merged caches.
# Each repo exports in its OWN job, cached under its OWN lock's hash:
# unchanged locks are never re-realised, and one slow or failing repo
# neither blocks nor discards the others (v2's single monolithic
# export job ran blind for 48+ min with no per-repo signal, run
# 41539380529). Optional repos (nix, zettel) may fail without failing
# the publish; required repos (code, opencode, openchamber) may not.
#
# Triggers follow the fleet rule (main, not PRs) plus manual dispatch.
# `fresh_build` ignores the Docker layer cache AND the nar cache.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      fresh_build:
        description: "Fresh build (ignore layer cache and nar cache)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push :latest / :base
        uses: docker/build-push-action@v6
        with:
          context: containers/fleet-build
          file: containers/fleet-build/Containerfile
          target: base
          push: true
          tags: |
            ghcr.io/dezren39/fleet-build:latest
            ghcr.io/dezren39/fleet-build:base
            ghcr.io/dezren39/fleet-build:sha-${{ github.sha }}
          no-cache: ${{ inputs.fresh_build == true }}
          cache-from: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-base
          cache-to: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-base,mode=max

  warm-export:
    needs: build-base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo: [code, opencode, openchamber, nix, zettel]
    # --user root: the image's default USER is vscode (devcontainers
    # base), under which actions/checkout cannot write the runner's
    # file-command dir (EACCES, run 41519078473). Steps here are
    # written for root anyway (see export.sh).
    container:
      image: ghcr.io/dezren39/fleet-build:base
      options: --user root
    # Optional repos must not fail the publish. Their export step is
    # continue-on-error below; this job itself never fails on them
    # because the only fallible step carries that flag.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init this repo's submodule (never hatch-personal — it is private)
        run: |
          # Workspace files are owned by the runner host's uid; git in
          # the container (root) calls that dubious ownership and
          # refuses (run 41520691666). This is our own ephemeral
          # workspace — mark it safe.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --jobs 4 ${{ matrix.repo }}
      - name: Compute nar cache key from this repo's lock + warmed shell as committed
        id: key
        run: |
          # The shell token is part of the key (issue #30): the key used
          # to be lock-only, so switching the manifest from one shell to
          # another (nix: default -> fleet) silently kept restoring the
          # OLD shell's closure and skipped the export entirely.
          shell=$(awk -v r="${{ matrix.repo }}" '$1 == r { for (i=2; i<=NF; i++) if ($i != "optional") { print $i; exit } }' containers/fleet-build/warm-manifest.txt)
          [ -z "$shell" ] && shell=default
          if [ "${{ inputs.fresh_build }}" = "true" ]; then
            echo "nar-key=fleet-nar-fresh-${{ matrix.repo }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "nar-key=fleet-nar-${{ matrix.repo }}-$shell-${{ hashFiles(format('{0}/flake.lock', matrix.repo)) }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore nar cache
        id: nar
        uses: actions/cache@v4
        with:
          path: nar-cache
          key: ${{ steps.key.outputs.nar-key }}
      - name: Materialise nix-cache signing key for the export step
        if: steps.nar.outputs.cache-hit != 'true'
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          # export.sh signs closures with this key before pushing them
          # to the fleet binary cache. Owned by vscode (the export runs
          # as vscode) and mode 600; lives only on this ephemeral
          # runner.
          if [ -n "$NIX_CACHE_SIGNING_KEY" ]; then
            printf '%s' "$NIX_CACHE_SIGNING_KEY" > /home/vscode/.nix-cache-signing-key
            chown vscode:vscode /home/vscode/.nix-cache-signing-key
            chmod 600 /home/vscode/.nix-cache-signing-key
          fi
      - name: Realise shell + export closure (skipped on cache hit)
        if: steps.nar.outputs.cache-hit != 'true'
        continue-on-error: ${{ matrix.repo == 'nix' || matrix.repo == 'zettel' }}
        env:
          NIX_CACHE_UPLOAD_URL: ${{ secrets.NIX_CACHE_UPLOAD_URL }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          # Run the export AS vscode, who owns the single-user Nix
          # store (the root/BuildKit realisations are the ones that
          # died on the libstore SQLite assertion; see export.sh).
          mkdir -p nar-cache
          chown vscode:vscode nar-cache
          # libgit2 (Nix's flake fetcher) enforces the same ownership
          # rule as git: as vscode it refused the root-owned submodule
          # repos (run 41523275400). Mark them safe in vscode's config.
          runuser -u vscode -- env HOME=/home/vscode git config --global --add safe.directory '*'
          runuser -u vscode -- env HOME=/home/vscode GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            NIX_CACHE_UPLOAD_URL="$NIX_CACHE_UPLOAD_URL" \
            CACHIX_AUTH_TOKEN="$CACHIX_AUTH_TOKEN" \
            NIX_CACHE_SIGNING_KEY_FILE=/home/vscode/.nix-cache-signing-key \
            bash -lc 'cd "$GITHUB_WORKSPACE" && bash containers/fleet-build/export.sh containers/fleet-build/warm-manifest.txt "$GITHUB_WORKSPACE" "${{ matrix.repo }}"'
      - name: Drop empty nar cache after a failed optional export
        if: failure() && (matrix.repo == 'nix' || matrix.repo == 'zettel')
        run: |
          # An empty cache entry would poison later runs (cache-hit
          # with nothing in it). A PARTIAL cache is fine and useful —
          # only remove the dir when it holds no narinfo at all.
          if [ -z "$(find nar-cache -name '*.narinfo' -print -quit 2>/dev/null)" ]; then
            rm -rf nar-cache
          fi

      - name: Upload nar cache for build-full
        uses: actions/upload-artifact@v4
        with:
          name: nar-${{ matrix.repo }}
          path: nar-cache
          if-no-files-found: ignore
          retention-days: 7

  build-full:
    needs: warm-export
    # fleet#28: an optional leg's HARD job death (runner killed mid-step)
    # fails its warm-export job, and default needs semantics would skip
    # this publish even though every required repo exported fine.
    # !cancelled() runs the publish on any non-cancelled needs outcome;
    # the merge step below stays the real gate — it hard-fails if a
    # REQUIRED repo's nar cache is missing or empty. A cancelled run
    # still blocks the publish.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # The closures arrive as run artifacts, NOT via actions/cache:
          # cache entries saved by the containerised export jobs are
          # versioned on their in-container workspace path and are
          # invisible to this host job's restores (issue #20). The cache
          # still serves the export jobs themselves across runs.
      - name: Download per-repo nar caches
        uses: actions/download-artifact@v4
        with:
          pattern: nar-*
          path: restored
      - name: Merge caches into the build context (required repos must be present)
        run: |
          set -euo pipefail
          mkdir -p containers/fleet-build/nar-cache
          for r in code opencode openchamber; do
            if [ ! -d "restored/nar-$r" ] || [ -z "$(find "restored/nar-$r" -name '*.narinfo' -print -quit 2>/dev/null)" ]; then
              echo "ERROR: required nar cache for $r is missing or empty" >&2
              exit 1
            fi
          done
          for r in code opencode openchamber nix zettel; do
            if [ -d "restored/nar-$r" ]; then cp -a "restored/nar-$r/." containers/fleet-build/nar-cache/; fi
          done
          echo "merged narinfo count: $(find containers/fleet-build/nar-cache -name '*.narinfo' | wc -l)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push :full (imports the nar cache)
        uses: docker/build-push-action@v6
        with:
          context: containers/fleet-build
          file: containers/fleet-build/Containerfile
          target: full
          push: true
          tags: |
            ghcr.io/dezren39/fleet-build:full
            ghcr.io/dezren39/fleet-build:full-sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-full
          cache-to: type=registry,ref=ghcr.io/dezren39/fleet-build:buildcache-full,mode=max

  smoke:
    # Prove the published image actually works as a GHA job container —
    # the exact way consuming repos will use it, including a warmed
    # shell opening with the network off.
    needs: build-full
    # fleet#28 (transitive): smoke whenever build-full actually
    # succeeded, regardless of what happened to the optional export
    # legs upstream of it — and never against a stale image after a
    # build-full failure.
    if: ${{ !cancelled() && needs.build-full.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/dezren39/fleet-build:full
      options: --user root
    steps:
      - name: Toolchain check inside the published container
        run: |
          set -eux
          go version
          git --version
          jq --version
          nix --version
          # `su vscode` asks for a password in this image (run
          # 41513747440); runuser from root does not, and HOME must be
          # pointed at the vscode home for its Nix profile to resolve.
          runuser -u vscode -- env HOME=/home/vscode bash -lc 'nix --version && go version'
      # fleet#70: smoke the code rev the warm-export legs actually
      # realised — this repo's committed `code` submodule pin — not
      # code's floating main. A floating checkout can carry a
      # flake.nix whose inputs have moved past its committed lock
      # (the fork reorganization did exactly this), and then
      # `nix develop --offline` tries to refresh the lock mid-smoke:
      # a write the offline test should never need, against a closure
      # that was never warmed. The pin's lock is the nar-cache key
      # basis, so the pinned rev is the one whose shell is guaranteed
      # to be in the image's store.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Resolve the committed code submodule pin
        id: code-pin
        run: |
          # The checkout is owned by the runner host's uid; git as
          # root calls that dubious ownership and refuses (the same
          # wall warm-export documents, run 41520691666).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pin=$(git ls-tree HEAD code | awk '{print $3}')
          if [ -z "$pin" ]; then echo "ERROR: no code submodule pin at HEAD" >&2; exit 1; fi
          echo "code submodule pin: $pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: developing-today/code
          ref: ${{ steps.code-pin.outputs.pin }}
          path: code-check
      - name: Warmed shell opens OFFLINE from the image's store
        run: |
          # The checkout above is root-owned; Nix's libgit2 fetcher
          # refuses it as vscode (dubious ownership). The export jobs
          # hit the same wall (run 41523275400) — mark paths safe in
          # vscode's git config first.
          runuser -u vscode -- env HOME=/home/vscode git config --global --add safe.directory '*'
          # The smoke reads the checkout but must never need to write
          # it: run the develop against a vscode-owned copy, so a lock
          # refresh (should one ever be attempted) lands in the copy
          # instead of dying on the root-owned tree (fleet#70). The
          # copy is runner-local disk only — the offline guarantee is
          # unchanged: the shell still has to come from the image's
          # store.
          cp -a "$GITHUB_WORKSPACE/code-check" "$GITHUB_WORKSPACE/code-smoke"
          chown -R vscode:vscode "$GITHUB_WORKSPACE/code-smoke"
          # code warms its lean `fleet` shell (see warm-manifest.txt),
          # not the default shell — open the one that was warmed.
          timeout 600 runuser -u vscode -- env HOME=/home/vscode bash -lc 'cd "$GITHUB_WORKSPACE/code-smoke" && nix develop .#fleet --offline --accept-flake-config --command true'
